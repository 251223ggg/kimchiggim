
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색</title>

  <style>
    /* 전체 페이지의 기본 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    /* 화면을 왼쪽과 오른쪽으로 나누기 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      width: 380px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid #ddd;
      z-index: 1;
    }

    .header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid #eee;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .header p {
      margin: 0;
      color: #777;
      font-size: 13px;
    }

    /* 검색창과 버튼 */
    .search-form {
      display: flex;
      gap: 8px;
      padding: 16px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    #searchInput:focus {
      border-color: #f5c400;
    }

    #searchButton {
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      background: #fee500;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #searchButton:hover {
      background: #f4d900;
    }

    /* 검색 상태 메시지 */
    #status {
      padding: 0 16px 12px;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid #eee;
    }

    .result-item {
      padding: 16px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover {
      background: #fffbea;
    }

    .result-item h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .result-item p {
      margin: 4px 0;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .result-item .category {
      color: #a87900;
    }

    /* 오른쪽 지도 영역 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #f2f2f2;
    }

    /* 작은 화면에서도 두 영역이 보이도록 설정 */
    @media (max-width: 600px) {
      .sidebar {
        width: 45%;
        min-width: 0;
      }

      .header {
        padding: 16px 12px;
      }

      .header h1 {
        font-size: 17px;
      }

      .search-form {
        padding: 10px;
        flex-wrap: wrap;
      }

      #searchInput {
        width: 100%;
        flex-basis: 100%;
      }

      #searchButton {
        min-height: 36px;
      }

      .result-item {
        padding: 12px 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽: 검색창과 검색 결과 -->
    <aside class="sidebar">
      <header class="header">
        <h1>장소 탐색 지도</h1>
        <p>카카오맵으로 주변 장소를 검색해 보세요.</p>
      </header>

      <form class="search-form" id="searchForm">
        <input
          type="text"
          id="searchInput"
          placeholder="장소를 검색하세요 (예: 강남역)"
          autocomplete="off"
          aria-label="검색할 장소"
        >
        <button type="submit" id="searchButton">검색</button>
      </form>

      <div id="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다...
      </div>

      <div id="resultList"></div>
    </aside>

    <!-- 오른쪽: 카카오맵 -->
    <main id="map" aria-label="장소 검색 지도"></main>

  </div>

  <!-- 카카오맵 SDK: 장소 검색 기능을 위해 services 라이브러리 사용 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5845b1683e12f110576582b0adefc345&libraries=services&autoload=false"
    onerror="showSdkError()"
  ></script>

  <script>
    // HTML 요소 가져오기
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const resultList = document.getElementById("resultList");
    const statusElement = document.getElementById("status");

    // 지도와 검색에 사용할 변수
    let map = null;
    let placesService = null;
    let markers = [];
    let infoWindow = null;
    let currentLocationMarker = null;
    let isMapReady = false;

    // 기본 위치: 서울시청
    const defaultPosition = new kakao.maps.LatLng(
      37.5665,
      126.9780
    );

    // 상태 메시지 표시
    function setStatus(message) {
      statusElement.textContent = message;
    }

    // SDK를 불러오지 못했을 때 오류 표시
    function showSdkError() {
      setStatus(
        "카카오맵 SDK를 불러오지 못했습니다. 인터넷 연결과 API 설정을 확인하세요."
      );
    }

    // 카카오맵 SDK가 준비된 뒤에 지도 초기화
    function loadMap() {
      kakao.maps.load(function () {
        try {
          // 지도 생성
          const mapContainer = document.getElementById("map");

          map = new kakao.maps.Map(mapContainer, {
            center: defaultPosition,
            level: 5
          });

          // 장소 검색 서비스 생성
          placesService = new kakao.maps.services.Places();

          // 장소 정보를 보여 줄 말풍선 생성
          infoWindow = new kakao.maps.InfoWindow({
            zIndex: 10
          });

          // 지도 초기화 완료
          isMapReady = true;
          setStatus("현재 위치를 확인하고 있습니다...");

          // 지도와 검색 기능이 준비된 뒤 현재 위치 요청
          getCurrentLocation();

        } catch (error) {
          console.error("지도 초기화 오류:", error);
          setStatus(
            "지도 초기화에 실패했습니다. API 키와 도메인 설정을 확인하세요."
          );
        }
      });
    }

    // 브라우저에서 현재 위치 가져오기
    function getCurrentLocation() {
      // 위치 정보 기능을 지원하지 않는 브라우저 확인
      if (!navigator.geolocation) {
        setStatus("위치 기능을 지원하지 않아 서울을 기본 위치로 표시합니다.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 현재 위치의 위도와 경도 가져오기
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          const currentPosition = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          // 현재 위치로 지도 이동
          map.setCenter(currentPosition);
          map.setLevel(5);

          // 현재 위치 마커 생성
          currentLocationMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            title: "내 현재 위치"
          });

          // 현재 위치 안내 창 생성
          const locationInfo = document.createElement("div");
          locationInfo.style.cssText =
            "padding:8px 12px;font-size:13px;white-space:nowrap;";
          locationInfo.textContent = "내 현재 위치";

          const locationWindow = new kakao.maps.InfoWindow({
            content: locationInfo
          });

          locationWindow.open(map, currentLocationMarker);

          setStatus(
            "현재 위치를 표시했습니다. 장소를 검색해 보세요."
          );
        },
        function (error) {
          // 위치 권한 거부 또는 위치 확인 실패 처리
          console.warn("현재 위치를 가져오지 못했습니다:", error);

          map.setCenter(defaultPosition);
          map.setLevel(5);

          if (error.code === error.PERMISSION_DENIED) {
            setStatus(
              "위치 권한이 거부되었습니다. 서울을 기준으로 검색할 수 있습니다."
            );
          } else {
            setStatus(
              "현재 위치를 확인하지 못했습니다. 서울을 기준으로 검색할 수 있습니다."
            );
          }
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 기존 검색 마커 삭제
    function clearMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });

      markers = [];

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 검색 결과 목록 비우기
    function clearResults() {
      resultList.replaceChildren();
    }

    // 장소를 검색하는 함수
    function searchPlaces(keyword) {
      if (!isMapReady || !placesService) {
        setStatus("지도가 아직 준비되지 않았습니다.");
        return;
      }

      if (!keyword.trim()) {
        setStatus("검색할 장소명을 입력해 주세요.");
        searchInput.focus();
        return;
      }

      clearMarkers();
      clearResults();

      setStatus("장소를 검색하고 있습니다...");
      searchButton.disabled = true;

      // 카카오 장소 검색 API 호출
      placesService.keywordSearch(
        keyword,
        function (data, resultStatus) {
          searchButton.disabled = false;

          if (
            resultStatus === kakao.maps.services.Status.OK
          ) {
            displayPlaces(data);
          } else if (
            resultStatus === kakao.maps.services.Status.ZERO_RESULT
          ) {
            setStatus("검색 결과가 없습니다. 다른 검색어를 입력해 보세요.");
          } else {
            setStatus("검색 중 오류가 발생했습니다. 다시 시도해 주세요.");
          }
        },
        {
          // 현재 지도 중심 주변의 검색 결과를 우선 탐색
          location: map.getCenter(),
          size: 15
        }
      );
    }

    // 검색 결과를 지도와 목록에 표시
    function displayPlaces(places) {
      clearResults();

      // 검색 결과에 맞게 지도의 범위 조정
      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place, index) {
        const position = new kakao.maps.LatLng(
          place.y,
          place.x
        );

        bounds.extend(position);

        // 장소 마커 생성
        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name
        });

        markers.push(marker);

        // 마커 클릭 시 장소 이름 표시
        kakao.maps.event.addListener(marker, "click", function () {
          showPlaceInfo(place, marker);
        });

        // 왼쪽 결과 목록에 장소 정보 추가
        const item = document.createElement("article");
        item.className = "result-item";
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute(
          "aria-label",
          place.place_name + " 위치 보기"
        );

        const title = document.createElement("h3");
        title.textContent = (index + 1) + ". " + place.place_name;

        const category = document.createElement("p");
        category.className = "category";
        category.textContent =
          place.category_group_name || place.category_name || "장소";

        const address = document.createElement("p");
        address.textContent =
          "주소: " +
          (place.road_address_name || place.address_name || "주소 정보 없음");

        const phone = document.createElement("p");
        phone.textContent =
          "전화: " + (place.phone || "정보 없음");

        item.append(title, category, address, phone);

        // 결과 항목을 클릭하거나 키보드로 선택하면 지도 이동
        function selectPlace() {
          map.panTo(position);
          map.setLevel(5);
          showPlaceInfo(place, marker);
        }

        item.addEventListener("click", selectPlace);

        item.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectPlace();
          }
        });

        resultList.appendChild(item);
      });

      // 검색 결과 전체가 보이도록 지도 범위 조정
      if (places.length === 1) {
        map.setCenter(
          new kakao.maps.LatLng(places[0].y, places[0].x)
        );
        map.setLevel(5);
      } else {
        map.setBounds(bounds);
      }

      setStatus("검색 결과 " + places.length + "개를 찾았습니다.");
    }

    // 선택한 장소의 정보를 지도 위에 표시
    function showPlaceInfo(place, marker) {
      const content = document.createElement("div");
      content.style.cssText =
        "padding:10px 12px;max-width:240px;font-size:13px;line-height:1.6;";

      const title = document.createElement("strong");
      title.textContent = place.place_name;

      const address = document.createElement("div");
      address.textContent =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      content.append(title, address);

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // 검색 버튼 또는 Enter 키로 검색 실행
    searchForm.addEventListener("submit", function (event) {
      event.preventDefault();
      searchPlaces(searchInput.value);
    });

    // 카카오맵 SDK가 로드된 후 초기화 시작
    window.addEventListener("load", function () {
      if (typeof kakao === "undefined" || !kakao.maps) {
        showSdkError();
        return;
      }

      loadMap();
    });
  </script>
</body>
</html>
